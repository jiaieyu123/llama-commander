name: Release

# 触发方式：
#   1. 推送 v* 标签（如 git tag v0.1.0 && git push origin v0.1.0）→ 构建并发布 Release
#   2. 手动：GitHub Actions 页面 → Run workflow（只构建制品，不发布）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: .exe
            runner: windows-latest
          - os: linux
            arch: amd64
            ext: ''
            runner: ubuntu-latest
          - os: darwin
            arch: arm64
            ext: ''
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags "-s -w" -o llama-launcher-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-launcher-${{ matrix.os }}-${{ matrix.arch }}
          path: llama-launcher-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    # 仅当通过 v* 标签触发时发布 Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show artifacts
        run: ls -lhR artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
